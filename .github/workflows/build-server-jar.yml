name: Build server.jar

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile wrapper
        run: |
          mkdir -p build/classes build/META-INF
          javac -encoding UTF-8 --release 21 -d build/classes wrapper-src/miao/wrapper/Main.java

      - name: Package server.jar
        run: |
          printf 'Manifest-Version: 1.0\nMain-Class: miao.wrapper.Main\n\n' > build/META-INF/MANIFEST.MF
          cd build && jar cfm ../server.jar META-INF/MANIFEST.MF -C classes . && cd ..

      - name: Verify jar
        run: |
          unzip -l server.jar
          jar tf server.jar | grep -q 'miao/wrapper/Main.class' && echo "Main.class OK"
          jar tf server.jar | grep -q 'META-INF/MANIFEST.MF' && echo "Manifest OK"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: server.jar
          path: server.jar

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: server.jar (latest)
          files: server.jar
          make_latest: true